auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: memberlist
  storage:
    s3:
      endpoint: http://posts-minio:9000
      bucketnames: loki-data
      access_key_id: ${MINIO_ROOT_USER}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      s3forcepathstyle: true
      insecure: true

memberlist:
  join_members:
    - posts-loki-read:7946
    - posts-loki-write:7946
    - posts-loki-backend:7946

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  aws:
    s3: s3://dummy:dummy@posts-minio:9000/loki-data
    s3forcepathstyle: true

compactor:
  working_directory: /loki/compactor
  compactor_ring:
    kvstore:
      store: memberlist

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

ruler:
  storage:
    type: s3
    s3:
      endpoint: http://posts-minio:9000
      bucketnames: loki-ruler
      access_key_id: ${MINIO_ROOT_USER}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      s3forcepathstyle: true
      insecure: true
  rule_path: /loki/rules
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: memberlist
  enable_api: true

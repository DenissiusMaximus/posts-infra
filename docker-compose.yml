services:
  posts-auth-db:
    image: postgres:16-alpine
    container_name: posts-auth-db
    env_file:
      - ./env/auth-db.env
    volumes:
      - posts_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  posts-auth-api:
    image: ${AUTH_API_IMAGE}
    container_name: posts-auth-api
    env_file:
      - ./env/auth-api.env
    environment:
      DB_HOST: posts-auth-db
      DB_PORT: 5432
    depends_on:
      posts-auth-db:
        condition: service_healthy
    restart: unless-stopped

  posts-gateway-api:
    image: ${GATEWAY_API_IMAGE}
    container_name: posts-gateway-api
    env_file:
      - ./env/gateway-api.env
    depends_on:
      - posts-auth-api
    networks:
      - default
      - gateway_net
    restart: unless-stopped

volumes:
  posts_auth_pgdata:

networks:
  default:
  gateway_net:
    external: true

services:
  posts-auth-db:
    image: postgres:16-alpine
    container_name: posts-auth-db
    env_file:
      - ./env/auth-db.env
    volumes:
      - posts_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  posts-auth-api:
    image: ${AUTH_API_IMAGE}
    container_name: posts-auth-api
    env_file:
      - ./env/auth-api.env
    environment:
      DB_HOST: posts-auth-db
      DB_PORT: 5432
    depends_on:
      posts-auth-db:
        condition: service_healthy
    restart: unless-stopped

  posts-gateway-api:
    image: ${GATEWAY_API_IMAGE}
    container_name: posts-gateway-api
    env_file:
      - ./env/gateway-api.env
    depends_on:
      - posts-auth-api
    networks:
      - default
      - gateway_net
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower
    container_name: posts-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    command: --interval 60 --cleanup posts-auth-api posts-gateway-api
    restart: unless-stopped

  posts-loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: posts-loki
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki
      - default
      - gateway_net

  posts-alloy:
    image: grafana/alloy:${ALLOY_VERSION:-latest}
    container_name: posts-alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "${ALLOY_UI_PORT:-12345}:12345"
    depends_on:
      - posts-loki
    networks:
      - loki

  posts-grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: posts-grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://posts-grafana.lacarte.dev}
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/loki.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://posts-loki:3100
            isDefault: true
            version: 2
            editable: true
        EOF
        /run.sh
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - posts-loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki
      - gateway_net

volumes:
  posts_auth_pgdata:
  grafana_data:
  loki_data:

networks:
  default:
  loki:
  gateway_net:
    external: true

services:
  posts-auth-db:
    image: postgres:16-alpine
    container_name: posts-auth-db
    env_file:
      - ./env/auth-db.env
    volumes:
      - posts_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  posts-auth-api:
    image: ${AUTH_API_IMAGE}
    container_name: posts-auth-api
    env_file:
      - ./env/auth-api.env
    environment:
      DB_HOST: posts-auth-db
      DB_PORT: 5432
    depends_on:
      posts-auth-db:
        condition: service_healthy
    restart: unless-stopped

  posts-gateway-api:
    image: ${GATEWAY_API_IMAGE}
    container_name: posts-gateway-api
    env_file:
      - ./env/gateway-api.env
    depends_on:
      - posts-auth-api
    restart: unless-stopped

  caddy:
    image: caddy:${CADDY_VERSION:-alpine}
    container_name: posts-caddy
    ports:
      - "80:80"
      - "443:443"
      - "${CADDY_LOKI_GATEWAY_PORT:-3100}:3100"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - posts-gateway-api
      - posts-loki-read
      - posts-loki-write
      - posts-loki-backend
    networks:
      - default
      - loki
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower
    container_name: posts-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    command: --interval 60 --cleanup posts-auth-api posts-gateway-api
    restart: unless-stopped

  posts-loki-read:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: posts-loki-read
    command: "-config.file=/etc/loki/config.yaml -target=read -config.expand-env=true"
    env_file:
      - ./env/loki-read.env
    ports:
      - "${LOKI_READ_PORT:-3101}:3100"
      - "7946"
      - "9095"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - posts-minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      loki:
        aliases:
          - loki

  posts-loki-write:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: posts-loki-write
    command: "-config.file=/etc/loki/config.yaml -target=write -config.expand-env=true"
    env_file:
      - ./env/loki-write.env
    ports:
      - "${LOKI_WRITE_PORT:-3102}:3100"
      - "7946"
      - "9095"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - posts-minio
    networks:
      <<: *loki-dns

  posts-loki-backend:
    image: grafana/loki:${LOKI_VERSION:-latest}
    container_name: posts-loki-backend
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    env_file:
      - ./env/loki-backend.env
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false -config.expand-env=true"
    depends_on:
      - posts-minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki

  posts-alloy:
    image: grafana/alloy:${ALLOY_VERSION:-latest}
    container_name: posts-alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "${ALLOY_UI_PORT:-12345}:12345"
    depends_on:
      - caddy
    networks:
      - loki

  posts-minio:
    image: minio/minio
    container_name: posts-minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    env_file:
      - ./env/minio.env
    ports:
      - "9000"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - loki

  posts-grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: posts-grafana
    env_file:
      - ./env/grafana.env
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    depends_on:
      - caddy
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://caddy:3100
            jsonData:
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "$${LOKI_TENANT_ID}"
        EOF
        /run.sh
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

volumes:
  posts_auth_pgdata:
  pgdata:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  loki:

services:
  loki:
    image: grafana/loki:latest
    container_name: posts-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - gateway_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: posts-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=remote-write-receiver'
    volumes:
      - prometheus_data:/prometheus
    networks:
      - gateway_net
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: posts-alloy
    command: run /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway_net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: posts-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - gateway_net
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: posts-node-exporter
    networks:
      - gateway_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: posts-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gateway_net
    restart: unless-stopped

  posts-auth-db:
    image: postgres:16-alpine
    container_name: posts-auth-db
    env_file:
      - ./env/auth-db.env
    volumes:
      - posts_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  posts-auth-api:
    image: ${AUTH_API_IMAGE}
    container_name: posts-auth-api
    env_file:
      - ./env/auth-api.env
    environment:
      DB_HOST: posts-auth-db
      DB_PORT: 5432
    depends_on:
      posts-auth-db:
        condition: service_healthy
    restart: unless-stopped

  posts-gateway-api:
    image: ${GATEWAY_API_IMAGE}
    container_name: posts-gateway-api
    env_file:
      - ./env/gateway-api.env
    depends_on:
      - posts-auth-api
    networks:
      - default
      - gateway_net
    restart: unless-stopped

volumes:
  posts_auth_pgdata:
  grafana_data:
  prometheus_data:

networks:
  default:
  gateway_net:
    external: true
